<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><filter id="sh" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14161A" flood-opacity="0.07"/></filter><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D2E"/></marker></defs><rect width="1600" height="1000" fill="#F4F5F7"/><text x="56" y="72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#5B6270" text-anchor="start" letter-spacing="1.8">DELIVERY</text><text x="54" y="128" font-family="Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="-1">Shipped in batches, not one big drop</text><line x1="330" x2="330" y1="190" y2="760" stroke="#DDE1E7" stroke-dasharray="4 6"/><text x="338" y="778" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#5B6270" text-anchor="start" letter-spacing="0">June</text><line x1="610" x2="610" y1="190" y2="760" stroke="#DDE1E7" stroke-dasharray="4 6"/><text x="618" y="778" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#5B6270" text-anchor="start" letter-spacing="0">July</text><line x1="930" x2="930" y1="190" y2="760" stroke="#DDE1E7" stroke-dasharray="4 6"/><text x="938" y="778" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#5B6270" text-anchor="start" letter-spacing="0">August</text><rect x="56" y="226" width="240" height="68" rx="14" fill="#FFFFFF" filter="url(#sh)"/><circle cx="84" cy="260" r="8" fill="#7B93C4"/><text x="102" y="266" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">UX &amp; structure</text><line x1="330" x2="1520" y1="260" y2="260" stroke="#E3E6EB" stroke-width="4" stroke-linecap="round"/><line x1="414" x2="797" y1="260" y2="260" stroke="#7B93C4" stroke-width="4" stroke-linecap="round"/><circle cx="414" cy="260" r="9" fill="#fff" stroke="#7B93C4" stroke-width="4"/><text x="414" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161A" text-anchor="middle" letter-spacing="0">Early June · Interviews</text><text x="414" y="221" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3B414C" text-anchor="middle" letter-spacing="0">lifecycle map</text><circle cx="545" cy="260" r="9" fill="#fff" stroke="#7B93C4" stroke-width="4"/><text x="545" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161A" text-anchor="middle" letter-spacing="0">Jun 24 · Project entity</text><text x="545" y="313" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3B414C" text-anchor="middle" letter-spacing="0">proposed</text><circle cx="732" cy="260" r="9" fill="#fff" stroke="#7B93C4" stroke-width="4"/><text x="732" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161A" text-anchor="middle" letter-spacing="0">Jul 14 · Structure</text><text x="732" y="221" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3B414C" text-anchor="middle" letter-spacing="0">approved</text><circle cx="797" cy="260" r="9" fill="#fff" stroke="#7B93C4" stroke-width="4"/><text x="797" y="294" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161A" text-anchor="middle" letter-spacing="0">Jul 21 · Navigation</text><text x="797" y="313" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3B414C" text-anchor="middle" letter-spacing="0">+ Home direction</text><rect x="56" y="416" width="240" height="68" rx="14" fill="#FFFFFF" filter="url(#sh)"/><circle cx="84" cy="450" r="8" fill="#FF4D2E"/><text x="102" y="456" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Dev handoff</text><line x1="330" x2="1520" y1="450" y2="450" stroke="#E3E6EB" stroke-width="4" stroke-linecap="round"/><line x1="980" x2="1180" y1="450" y2="450" stroke="#FF4D2E" stroke-width="4" stroke-linecap="round"/><circle cx="980" cy="450" r="9" fill="#fff" stroke="#FF4D2E" stroke-width="4"/><text x="980" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161A" text-anchor="middle" letter-spacing="0">Aug 6 · Batch 1</text><text x="980" y="411" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3B414C" text-anchor="middle" letter-spacing="0">Home</text><circle cx="1180" cy="450" r="9" fill="#fff" stroke="#FF4D2E" stroke-width="4"/><text x="1180" y="484" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161A" text-anchor="middle" letter-spacing="0">Aug 11 · Batch 2</text><text x="1180" y="503" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3B414C" text-anchor="middle" letter-spacing="0">Campaigns</text><rect x="56" y="606" width="240" height="68" rx="14" fill="#FFFFFF" filter="url(#sh)"/><circle cx="84" cy="640" r="8" fill="#3DADFF"/><text x="102" y="646" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">UI deliveries</text><line x1="330" x2="1520" y1="640" y2="640" stroke="#E3E6EB" stroke-width="4" stroke-linecap="round"/><line x1="1010" x2="1470" y1="640" y2="640" stroke="#3DADFF" stroke-width="4" stroke-linecap="round"/><circle cx="1010" cy="640" r="9" fill="#fff" stroke="#3DADFF" stroke-width="4"/><text x="1010" y="582" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161A" text-anchor="middle" letter-spacing="0">Aug 10 · Revenue</text><text x="1010" y="601" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3B414C" text-anchor="middle" letter-spacing="0">Metrics</text><circle cx="1180" cy="640" r="9" fill="#fff" stroke="#3DADFF" stroke-width="4"/><text x="1180" y="674" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161A" text-anchor="middle" letter-spacing="0">Aug 11 · 6 modules</text><text x="1180" y="693" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3B414C" text-anchor="middle" letter-spacing="0">+ Media Plan</text><circle cx="1350" cy="640" r="9" fill="#fff" stroke="#3DADFF" stroke-width="4"/><text x="1350" y="582" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161A" text-anchor="middle" letter-spacing="0">Aug 12 · Onboarding</text><text x="1350" y="601" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3B414C" text-anchor="middle" letter-spacing="0">+ design system</text><circle cx="1470" cy="640" r="9" fill="#fff" stroke="#3DADFF" stroke-width="4"/><text x="1470" y="674" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14161A" text-anchor="middle" letter-spacing="0">Late Aug · Files moved</text><text x="1470" y="693" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3B414C" text-anchor="middle" letter-spacing="0">to client Figma</text><rect x="56" y="800" width="720" height="140" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="84" y="846" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Task-level scope plan</text><text x="84" y="874" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Tasks, owners and what runs in parallel, so the client could plan their</text><text x="84" y="896" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">developers around dependencies.</text><rect x="800" y="800" width="744" height="140" rx="16" fill="#FFF1EE" filter="url(#sh)"/><text x="828" y="846" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FF4D2E" text-anchor="start" letter-spacing="0">Deferred on purpose</text><text x="828" y="874" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Deeper analysis of lower-priority report metrics, to keep time for development</text><text x="828" y="896" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">before the product presentation.</text></svg>