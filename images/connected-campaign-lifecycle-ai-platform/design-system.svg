<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><filter id="sh" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14161A" flood-opacity="0.07"/></filter><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D2E"/></marker></defs><rect width="1600" height="1000" fill="#F4F5F7"/><text x="56" y="72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#5B6270" text-anchor="start" letter-spacing="1.8">DESIGN SYSTEM &amp; HANDOFF</text><text x="54" y="128" font-family="Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="-1">Fix what is in use, document the rest</text><rect x="56" y="170" width="900" height="770" rx="18" fill="#FFFFFF" filter="url(#sh)"/><text x="88" y="222" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B6270" text-anchor="start" letter-spacing="0">Before</text><text x="88" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Undefined palette: the same colours, no rules for where they go</text><rect x="88" y="268" width="96" height="56" rx="10" fill="#1F2FE6"/><rect x="192" y="268" width="96" height="56" rx="10" fill="#3D4BFF"/><rect x="296" y="268" width="96" height="56" rx="10" fill="#B5F23D"/><rect x="400" y="268" width="96" height="56" rx="10" fill="#9BE22E"/><rect x="504" y="268" width="96" height="56" rx="10" fill="#7B93C4"/><rect x="608" y="268" width="96" height="56" rx="10" fill="#C2C8D4"/><rect x="712" y="268" width="96" height="56" rx="10" fill="#FF4D2E"/><rect x="816" y="268" width="96" height="56" rx="10" fill="#F59E0B"/><line x1="88" x2="924" y1="356" y2="356" stroke="#E3E6EB"/><text x="88" y="396" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FF4D2E" text-anchor="start" letter-spacing="0">After</text><text x="88" y="422" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Palette template: each colour mapped to where it is used</text><rect x="88" y="446" width="56" height="44" rx="10" fill="#1F2FE6"/><text x="164" y="465" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Primary</text><text x="164" y="485" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Main actions, links, active nav, charts (blue theme)</text><rect x="88" y="506" width="56" height="44" rx="10" fill="#B5F23D"/><text x="164" y="525" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Accent, used sparingly</text><text x="164" y="545" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Create actions, "new", highlights</text><rect x="88" y="566" width="56" height="44" rx="10" fill="#14161A"/><text x="164" y="585" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Text</text><text x="164" y="605" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Headings and body; contrast-checked</text><rect x="88" y="626" width="56" height="44" rx="10" fill="#C2C8D4"/><text x="164" y="645" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Neutrals</text><text x="164" y="665" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Borders, dividers, disabled states</text><rect x="88" y="686" width="56" height="44" rx="10" fill="#3E9B4B"/><text x="164" y="705" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Status</text><text x="164" y="725" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Active · Planned · Needs revision · Paused</text><line x1="88" x2="924" y1="760" y2="760" stroke="#E3E6EB"/><text x="88" y="796" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Type scale extended</text><text x="88" y="860" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">H1</text><text x="184" y="860" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">H2</text><text x="280" y="860" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">H3</text><text x="376" y="860" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">Body</text><text x="472" y="860" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">Small</text><text x="568" y="860" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">Caption</text><text x="88" y="904" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Only components used in the redesign were fixed; the rest went into a documented backlog.</text><rect x="980" y="170" width="564" height="470" rx="18" fill="#FFFFFF" filter="url(#sh)"/><text x="1012" y="222" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Final handoff</text><circle cx="1028" cy="280" r="16" fill="#FF4D2E"/><path d="M1020,280 l6,6 l11,-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1060" y="277" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Clickable prototype</text><text x="1060" y="299" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">key flows, Figma-native</text><circle cx="1028" cy="368" r="16" fill="#FF4D2E"/><path d="M1020,368 l6,6 l11,-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1060" y="365" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Files in the client's Figma</text><text x="1060" y="387" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">with the design system file</text><circle cx="1028" cy="456" r="16" fill="#FF4D2E"/><path d="M1020,456 l6,6 l11,-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1060" y="453" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Variables JSON export</text><text x="1060" y="475" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">plus logo, icons, images</text><circle cx="1028" cy="544" r="16" fill="#FF4D2E"/><path d="M1020,544 l6,6 l11,-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1060" y="541" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Loom walkthroughs</text><text x="1060" y="563" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">one per delivery</text><rect x="980" y="664" width="564" height="276" rx="18" fill="#14161A" filter="url(#sh)"/><text x="1012" y="790" font-family="Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-3">≈90%</text><text x="1012" y="836" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#C9D1E0" text-anchor="start" letter-spacing="0">of client comments closed in the last review</text><text x="1012" y="863" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#C9D1E0" text-anchor="start" letter-spacing="0">round</text></svg>