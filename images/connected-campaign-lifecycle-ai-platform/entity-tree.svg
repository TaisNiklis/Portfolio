<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><filter id="sh" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14161A" flood-opacity="0.07"/></filter><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D2E"/></marker></defs><rect width="1600" height="1000" fill="#F4F5F7"/><text x="56" y="72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#5B6270" text-anchor="start" letter-spacing="1.8">ENTITY MODEL</text><text x="54" y="128" font-family="Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="-1">One Project holds the whole campaign</text><rect x="56" y="500" width="230" height="110" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="78" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Platform team</text><text x="78" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Admin · Manager</text><rect x="340" y="500" width="250" height="110" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="362" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Client (brand)</text><text x="362" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Brand admin · Brand user</text><path d="M286,555 H313 V555 H340" fill="none" stroke="#B9C0CC" stroke-width="2"/><rect x="650" y="180" width="330" height="86" rx="16" fill="#FFFFFF" stroke="#B9C0CC" stroke-width="2" stroke-dasharray="7 6"/><text x="672" y="220" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Tools</text><text x="672" y="246" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Research, planning, AI chat</text><rect x="650" y="300" width="330" height="230" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="672" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Brand Hub</text><text x="672" y="366" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Client-level, shared by all projects</text><rect x="672" y="388" width="121" height="30" rx="8" fill="#EEF1F6"/><text x="684" y="405" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">Brand profile</text><rect x="801" y="388" width="106" height="30" rx="8" fill="#EEF1F6"/><text x="813" y="405" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">Competitors</text><rect x="672" y="428" width="84" height="30" rx="8" fill="#EEF1F6"/><text x="684" y="445" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">Personas</text><rect x="764" y="428" width="109" height="30" rx="8" fill="#EEF1F6"/><text x="776" y="445" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">AI segments</text><rect x="672" y="468" width="121" height="30" rx="8" fill="#EEF1F6"/><text x="684" y="485" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">Brand studies</tex