ign</text><path d="M980,675 H1030 V501 H1080" fill="none" stroke="#B9C0CC" stroke-width="2"/><rect x="1080" y="544" width="464" height="62" rx="12" fill="#FFFFFF" filter="url(#sh)"/><text x="1100" y="571" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Research assets</text><text x="1100" y="593" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Attached from the Brand Hub</text><path d="M980,675 H1030 V575 H1080" fill="none" stroke="#B9C0CC" stroke-width="2"/><rect x="1080" y="618" width="464" height="112" rx="12" fill="#FFFFFF" filter="url(#sh)"/><text x="1100" y="645" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Reporting</text><rect x="1100" y="662" width="80" height="29" rx="8" fill="#EEF1F6"/><text x="1112" y="678" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">Standard</text><rect x="1186" y="662" width="80" height="29" rx="8" fill="#EEF1F6"/><text x="1198" y="678" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">Advanced</text><rect x="1272" y="662" width="51" height="29" rx="8" fill="#EEF1F6"/><text x="1284" y="678" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">MMM</text><rect x="1329" y="662" width="150" height="29" rx="8" fill="#EEF1F6"/><text x="1341" y="678" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#14161A" text-anchor="start" letter-spacing="0">Path to Conversion</text><text x="1100" y="714" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5B6270" text-anchor="start" letter-spacing="0">Premium reports: visible but locked</text><path d="M980,675 H1030 V674 H1080" fill="none" stroke="#B9C0CC" stroke-width="2"/><rect x="1080" y="742" width="464" height="62" rx="12" fill="#FFFFFF" filter="url(#sh)"/><text x="1100" y="769" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Activity log</text><text x="1100" y="791" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Status changes and comments</text><path d="M980,675 H1030 V773 H1080" fill="none" stroke="#B9C0CC" stroke-width="2"/><rect x="1080" y="816" width="464" height="62" rx="12" fill="#FFFFFF" filter="url(#sh)"/><text x="1100" y="843" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14161A" text-anchor="start" letter-spacing="0">Files</text><text x="1100" y="865" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Briefs, creatives, exports</text><path d="M980,675 H1030 V847 H1080" fill="none" stroke="#B9C0CC" stroke-width="2"/><text x="56" y="940" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#3B414C" text-anchor="start" letter-spacing="0">Platform team → clients → projects. Research lives at client level; each project gets its own plan, reports and history.</text></svg>