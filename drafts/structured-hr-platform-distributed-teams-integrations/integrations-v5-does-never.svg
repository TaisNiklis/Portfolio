 r="22" fill="#EFE3FB"/><g transform="translate(86.0 410.0) scale(1.0)" fill="none" stroke="#8A2BE2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="M12 7v5.2l3.4 2"/></g><text x="132" y="418" font-size="19" font-weight="700" fill="#16131D" text-anchor="start" letter-spacing="0">Time Doctor</text><text x="132" y="442" font-size="14" font-weight="400" fill="#6E6878" text-anchor="start" letter-spacing="0">Time tracking</text><circle cx="349" cy="412" r="11" fill="#8A2BE2"/><g transform="translate(341.8 404.8) scale(0.6)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></g><text x="370" y="417.0" font-size="16" font-weight="500" fill="#16131D" text-anchor="start" letter-spacing="0">Fills timesheets</text><text x="370" y="438.6" font-size="16" font-weight="500" fill="#16131D" text-anchor="start" letter-spacing="0">automatically, per talent</text><circle cx="649" cy="412" r="11" fill="#ECE9F0"/><g transform="translate(642.4 405.4) scale(0.55)" fill="none" stroke="#6E6878" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7L7 17"/></g><text x="670" y="417.0" font-size="16" font-weight="500" fill="#16131D" text-anchor="start" letter-spacing="0">Overwrite an entry</text><text x="670" y="438.6" font-size="16" font-weight="500" fill="#16131D" text-anchor="start" letter-spacing="0">the talent has edited</text>
