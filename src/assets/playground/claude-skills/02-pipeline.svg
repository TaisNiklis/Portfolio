<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A pipeline: raw notes go through a skill and come out as a finished case">
  <rect width="800" height="600" fill="#0f29d2"/>
  <path d="M200 210 H600" stroke="#fff" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round" fill="none"/>
  <path d="M282 196 l16 14 -16 14 M522 196 l16 14 -16 14" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- raw notes -->
  <g transform="rotate(-8 140 210)"><rect x="70" y="140" width="130" height="130" rx="10" fill="#ffbf00"/></g>
  <g transform="rotate(6 160 200)"><rect x="95" y="130" width="130" height="130" rx="10" fill="#ffd34d"/>
    <rect x="115" y="160" width="80" height="10" rx="5" fill="#0e0c15" opacity=".35"/>
    <rect x="115" y="182" width="60" height="10" rx="5" fill="#0e0c15" opacity=".35"/>
    <rect x="115" y="204" width="90" height="10" rx="5" fill="#0e0c15" opacity=".35"/></g>
  <!-- skill -->
  <circle cx="400" cy="210" r="88" fill="#0e0c15"/>
  <path d="M400 150 l18 42 42 18 -42 18 -18 42 -18 -42 -42 -18 42 -18z" fill="#ffbf00"/>
  <!-- output -->
  <rect x="560" y="120" width="160" height="200" rx="18" fill="#fff"/>
  <rect x="584" y="146" width="112" height="56" rx="8" fill="#0f29d2"/>
  <rect x="584" y="220" width="100" height="10" rx="5" fill="#0e0c15"/>
  <rect x="584" y="242" width="112" height="10" rx="5" fill="#e6e6ec"/>
  <rect x="584" y="264" width="80" height="10" rx="5" fill="#e6e6ec"/>
  <circle cx="712" cy="128" r="26" fill="#ffbf00"/>
  <path d="M700 128 l9 9 16 -18" stroke="#0e0c15" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
